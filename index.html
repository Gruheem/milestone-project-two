<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Pairs</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div>
      <h1 class="hidden">Poke-Pairs a pokemon memory game</h1>
      <div class="title-image">
        <img
          id="poke-pairs"
          src="assets/images/poke-title.webp"
          alt="Pokemon Pairs Title"
        />
      </div>
    </div>
    <!-- Home -->
    <div id="home">
      <button id="openModal" class="game-button hidden">Open Modal</button>
      <div id="seldef">
        <p class="border">Select your difficulty</p>
      </div>
      <div id="difficulty-select" class="button-div">
        <button id="easyBtn" class="button easyBtn">Easy</button>
        <button id="mediumBtn" class="button mediumBtn">Medium</button>
        <button id="hardBtn" class="button hardBtn">Hard</button>
      </div>
      <div class="home-instructions">
        <div class="instructions border">
          <p id="instructions">
            Match two cards with the same pokemon until you have found all the
            pairs!
          </p>
        </div>
      </div>
    </div>
    <!-- Game Board -->
    <div id="game" class="hidden">
      <div id="stats" class="stats">
        <p id="timeCounter" class="border">
          TIME: <span id="time">00:00</span>
        </p>
        <p id="noOfMoves" class="border">MOVES: <span id="moves"></span></p>
        <p id="errorCount" class="border">ERRORS: <span id="errors"></span></p>
      </div>

      <div id="game-board" class="game-board">
        <!-- Game cards -->
      </div>
      <div class="flex-centre">
        <div class="in-game-button-div">
          <button id="restartGame" class="resetGame game-button">
            Restart Game
          </button>
          <button id="selectDifficulty" class="game-button">
            Select Difficulty
          </button>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div id="myModal" class="modal hidden">
      <div class="modal-content border">
        <div class="modal-header">
          <span id="close" class="close">&times;</span>
          <h2 class="hidden">Congratulations!!!</h2>
          <div>
            <img
              src="assets/images/congratulations-image.webp"
              alt="Congratulations"
            />
          </div>
        </div>
        <div class="modal-body">
          <div class="modal-stats">
            <p class="nudge-right">
              TOTAL MOVES: <span id="modalMoves"></span>
            </p>
            <p>TOTAL ERRORS: <span id="modalErrors"></span></p>
            <p>TIME TO COMPLETE: <span id="modalTime"></span></p>
          </div>
        </div>
        <div class="modal-footer">
          <button id="reset" class="resetGame modal-button">restart game</button>
          <button id="diffSelect" class="modal-button">
            Select Difficulty
          </button>
        </div>
      </div>
    </div>
    <script src="assets/js/game.js"></script>
  </body>
</html>
