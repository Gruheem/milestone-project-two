<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Pairs</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div>
      <h1 class="hidden">Poke-Pairs a pokemon memory game</h1>
      <div class="title-image">
        <img
        id="poke-pairs"
          src="assets/images/poke-title.png"
          alt="Pokemon Pairs Title"
        />
      </div>
    </div>
    <!-- Home -->
    <div id="home" class="">
      <div id="seldef">
        <h2 class="border">Select your difficulty</h2>
      </div>
      <div id="difficulty-select" class="button-div">
        <button id="easyBtn" class="button easyBtn">Easy</button>
        <button id="mediumBtn" class="button mediumBtn">Medium</button>
        <button id="hardBtn" class="button hardBtn">Hard</button>
      </div>
      <div class="home-instructions">
        <div class="instructions border">
          <p id="instructions">
            Match two cards with the same pokemon until you have found all the
            pairs!
          </p>
        </div>
      </div>
    </div>
    <!-- Game Board -->
    <div id="game" class="hidden">
      <div id="stats" class="stats">
        <p id="timeCounter">Time: <span id="time">00:00</span></p>
        <p id="noOfMoves">Moves: <span id="moves"></span></p>
        <p id="errorCount">Errors: <span id="errors"></span></p>
      </div>

      <div id="game-board" class="game-board">
        <!-- Game cards -->
      </div>
      <div class="in-game-buttons">
        <button id="restartGame" class="resetGame in-game-button button">
          Restart Game
        </button>
        <button id="selectDifficulty" class="in-game-button button">
          Select Difficulty
        </button>
      </div>
    </div>

    <!-- Modal -->
    <div id="myModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <p>Congrats</p>
          <span id="close" class="close">&times;</span>
        </div>
        <div class="modal-body">
          <div>
            <p>Total Moves: <span id="modalMoves"></span></p>
            <p>Total Errors: <span id="modalErrors"></span></p>
            <p>Time to Complete: <span id="modalTime"></span></p>
          </div>
        </div>
        <div class="modal-footer">
          <button id="reset" class="resetGame">reset</button>
          <button id="diffSelect">Select Difficulty</button>
        </div>
      </div>
    </div>
    <script src="assets/js/game.js"></script>
  </body>
</html>
