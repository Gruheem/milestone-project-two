<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Pairs</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div>
        <h1>Pokemon Pairs</h1>
    </div>
    <div id="home" class="">
    <div>
        <h3>Select your difficulty</h3>
    </div>
    <div id="difficulty-select" class="buttons">
        <button id="easyBtn">Easy</button>
        <button id="mediumBtn">Medium</button>
        <button id="hardBtn">Hard</button>
    </div>
    <div class="instructions">
        <p id="instructions">Match two cards with the same pokemon until you have found all the pairs!</p>
    </div>
    </div>
    <div id="game" class="hidden">
      <div id="stats" class="stats">
      <p id="time">Time:</p>
      <p id="noOfMoves">Moves:</p>
      <p id="difficulty">Difficulty:</p>
    </div>

    <div id="game-board" class="game-board">
      <!-- Game cards -->
    </div>
    <div class="in-game-buttons">
      <button id="restartGame">Restart Game</button>
      <button id="selectDifficulty">Select Difficulty</button>
    </div>
    </div>
    <script src="assets/js/game.js"></script>
  </body>
</html>
